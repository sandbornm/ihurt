name: iOS simulator
on:
  push:
    branches: [main]
    paths:
      - ios/**
      - src/**
      - public/**
      - assembly/**
      - LICENSE
      - index.html
      - capacitor.config.ts
      - vite.config.ts
      - tsconfig.json
      - package*.json
      - scripts/ios-*.mjs
      - scripts/setup.mjs
      - scripts/fetch_mediapipe.py
      - scripts/offline-build.mjs
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ios/**
      - src/**
      - public/**
      - assembly/**
      - LICENSE
      - index.html
      - capacitor.config.ts
      - vite.config.ts
      - tsconfig.json
      - package*.json
      - scripts/ios-*.mjs
      - scripts/setup.mjs
      - scripts/fetch_mediapipe.py
      - scripts/offline-build.mjs
      - .github/workflows/ios.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: iOS ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iphone
            configuration: Debug
            device: iPhone 16 Pro
          - target: ipad
            configuration: Debug
            device: iPad (A16)
          - target: release
            configuration: Release
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run ios:sync
      - name: Build without signing
        run: npm run ios:build -- --configuration ${{ matrix.configuration }}
      - name: Compile Release for physical iOS devices without signing
        if: matrix.configuration == 'Release'
        run: npm run ios:build -- --configuration Release --device
      - name: Test notebook interactions on an isolated simulator
        if: matrix.configuration == 'Debug'
        run: npm run test:ios-native -- --device '${{ matrix.device }}'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.configuration == 'Debug'
        with:
          name: ios-native-${{ matrix.target }}
          path: output/ios-native/
          retention-days: 3
          if-no-files-found: ignore
