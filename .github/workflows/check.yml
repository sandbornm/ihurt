name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --frozen --extra dev
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Check layouts, body controls, and exports
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: output/browser-check/
          retention-days: 3
          if-no-files-found: ignore
