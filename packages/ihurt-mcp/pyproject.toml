[project]
name = "ihurt-mcp"
version = "0.1.0"
description = "Read selected iHurt journal exports from a local MCP client"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Sandborn" }]
dependencies = ["mcp>=2.2,<3", "pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/sandbornm/ihurt"
Documentation = "https://github.com/sandbornm/ihurt/blob/main/docs/MCP.md"

[project.scripts]
ihurt-mcp = "ihurt_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.15"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
