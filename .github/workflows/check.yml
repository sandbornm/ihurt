name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --frozen --extra dev
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Check layouts, body controls, and exports
        run: npm run test:browser
      - name: Check painting, undo, layers, and viewport captures
        run: npm run test:controls
      - name: Check native export integration with a mocked bridge
        run: npm run test:ios-web
      - name: Check voice drafts with synthetic audio
        run: npm run test:voice
      - name: Check Apple speech integration with a mocked bridge
        run: npm run test:ios-speech
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: |
            output/browser-check/
            output/controls/
            output/ios-check/
            output/voice-check/
            output/ios-speech-check/
          retention-days: 3
          if-no-files-found: ignore
