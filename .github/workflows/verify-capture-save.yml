name: Verify capture and save
on:
  pull_request:
    paths:
      - src/notebook-storage.ts
      - src/notebook-data.ts
      - src/Notebook.tsx
      - src/voice/draft.ts
      - src/voice/VoiceDraft.tsx
      - src/voice/suggest-once.ts
      - src/voice/ai-gate.ts
      - src/voice/extraction.ts
      - src/anatomy/capture.ts
      - src/anatomy/hand-entry.ts
      - tests/capture-save-storage.test.ts
      - verification/capture-save/**
      - .github/workflows/verify-capture-save.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tlaplus
          key: tla2tools-1.7.4
      - run: bash verification/capture-save/run.sh
