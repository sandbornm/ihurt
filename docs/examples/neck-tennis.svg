<text x="380" y="322" font-size="13" fill="#60715c">YOUR DESCRIPTION</text><text x="380" y="350" font-size="16">My left upper trap and high left neck feel stiff after</text><text x="380" y="375" font-size="16">sleeping on my side and stomach. I noticed it again</text><text x="380" y="400" font-size="16">while serving in tennis. Looking down slowly and</text><text x="380" y="425" font-size="16">turning left brings it on.</text>
<text x="380" y="458" font-size="13" fill="#60715c">CONTEXT YOU PROVIDED</text><text x="380" y="484" font-size="14">Feeling: Stiff. Activity: Tennis. Timing: Since</text><text x="380" y="509" font-size="14">yesterday.</text>
