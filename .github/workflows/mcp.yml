name: MCP package
on:
  push:
    branches: [main]
    paths:
      - packages/ihurt-mcp/**
      - src/**
      - public/models/sources.json
      - docs/examples/*.json
      - .github/workflows/mcp.yml
  pull_request:
    paths:
      - packages/ihurt-mcp/**
      - src/**
      - public/models/sources.json
      - docs/examples/*.json
      - .github/workflows/mcp.yml
permissions:
  contents: read
concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ihurt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - run: uv build --no-sources
      - name: Verify the installed wheel
        run: |
          uv venv /tmp/ihurt-mcp-wheel
          uv pip install --python /tmp/ihurt-mcp-wheel/bin/python dist/*.whl
          /tmp/ihurt-mcp-wheel/bin/ihurt-mcp --file ../../docs/examples/neck-tennis.json --check
      - uses: actions/upload-artifact@v4
        with:
          name: ihurt-mcp-package
          path: packages/ihurt-mcp/dist/*
          retention-days: 3
